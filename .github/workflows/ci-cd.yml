# =============================================================================
# FABINS — GitHub Actions Automated CI/CD Pipeline
#
# Workflows executed:
#   1. Frontend CI: Type-check & Production Build validation
#   2. Backend CI: JUnit 5 Test suite execution & Spring Boot JAR compilation
#   3. Docker CI: Multi-stage Docker image verification for Frontend & Backend
# =============================================================================

name: FABINS Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. FRONTEND CI JOB
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Type-Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🔍 Run TypeScript Type Check
        run: npm run type-check

      - name: 🚀 Run Next.js Production Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2. BACKEND CI JOB
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend Test Suite & Maven Package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔑 Make Maven wrapper executable
        run: chmod +x mvnw

      - name: 🧪 Run JUnit 5 Unit & Integration Tests
        run: ./mvnw test

      - name: 📦 Build Spring Boot Executable JAR
        run: ./mvnw clean package -DskipTests

  # ---------------------------------------------------------------------------
  # 3. DOCKER BUILD VERIFICATION JOB
  # ---------------------------------------------------------------------------
  docker-ci:
    name: Docker Build Verification
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: fabins-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛠️ Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: fabins-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

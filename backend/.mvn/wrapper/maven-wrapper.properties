# Maven Wrapper configuration.
#
# `distributionType=only-script` means no maven-wrapper.jar is needed: the mvnw
# script downloads and caches the Maven distribution below on first use (into
# ~/.m2/wrapper). Nothing binary is committed to this repository.
#
# To upgrade Maven, change distributionUrl and commit — every developer and CI
# runner picks up the new version automatically on their next build.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
